<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review console · Ichnix</title>
    <link rel="icon" href="/evidence-graph.png?v=2" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/docs.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#review">Skip to content</a>
    <header class="mast">
      <div class="mast-inner">
        <a class="brand" href="/" aria-label="Ichnix home"
          ><img
            src="/evidence-graph.png"
            width="34"
            height="34"
            alt=""
          />Ichnix</a
        >
        <nav class="topnav" aria-label="Primary">
          <a href="/docs">Docs</a
          ><a href="/console" aria-current="page">Review console</a
          ><a id="private-signin" class="hosted-signin" href="/workspace"
            >Private sign-in</a
          >
        </nav>
      </div>
    </header>
    <main class="workspace" id="review">
      <header class="workspace-intro">
        <div>
          <h1>Review console</h1>
          <p id="workspace-label"></p>
        </div>
        <button id="leave" class="cmd" hidden>Disconnect</button>
        <div
          id="activity"
          class="view-activity"
          role="progressbar"
          aria-label="Connecting to workspace"
          hidden
        >
          <span class="thinking-mark" aria-hidden="true"></span>
        </div>
      </header>
      <div
        id="workspace-skeleton"
        class="console-skeleton"
        aria-hidden="true"
        hidden
      ></div>
      <form id="connect" aria-label="Connect to workspace" hidden>
        <label for="token">Access token</label>
        <div class="input-row">
          <input
            id="token"
            type="password"
            required
            autocomplete="off"
            spellcheck="false"
          /><button id="connect-submit" class="cmd primary" disabled>
            Connect
          </button>
        </div>
        <p class="hint">
          Use the token issued by your workspace administrator.
        </p>
      </form>
      <form id="report-upload" aria-label="Import a report" hidden>
        <label id="report-drop" for="report-file">
          <svg
            aria-hidden="true"
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 15V3m-4 4 4-4 4 4M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"
            />
          </svg>
          <strong id="report-name">Drop a report here</strong>
          <span class="file-caption"
            ><span id="report-browse">Choose file</span>
            <span id="report-format">JSON · up to 1 MiB</span></span
          >
          <input
            type="file"
            id="report-file"
            class="sr-only"
            aria-label="Choose a report file"
            aria-describedby="report-format"
            accept=".json,application/json"
            required
          />
        </label>
        <div class="upload-actions">
          <a href="/docs#providers">Report format</a>
          <button id="report-clear" type="button" class="cmd" hidden>
            Remove file
          </button>
          <button id="report-submit" class="cmd primary" disabled>
            <span class="thinking-mark" aria-hidden="true" hidden></span>
            Import report
          </button>
        </div>
      </form>
      <details id="evaluation" hidden>
        <summary>Learning curve</summary>
        <div id="evaluation-result" aria-live="polite"></div>
      </details>
      <p id="status" role="status"></p>
      <button id="retry" type="button" class="cmd" hidden>Try again</button>
      <noscript>Enable JavaScript to open the review console.</noscript>
      <div id="desk" hidden>
        <aside>
          <div class="aside-title">
            <h2>Cases <span id="case-count"></span></h2>
            <button id="reload" class="cmd">Refresh</button>
          </div>
          <label class="case-picker" for="case-select">Selected case</label
          ><select id="case-select" class="case-picker"></select>
          <nav id="case-pager" aria-label="Case pages" hidden>
            <button id="previous-page" class="cmd" type="button">
              Previous
            </button>
            <button id="next-page" class="cmd" type="button">Next</button>
          </nav>
          <ul id="cases"></ul>
        </aside>
        <article
          id="detail"
          aria-label="Case details"
          aria-live="polite"
        ></article>
      </div>
    </main>
  </body>
</html>
