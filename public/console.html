<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Review console · Ichnix</title>
    <link rel="icon" href="/evidence-graph.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#review">Skip to content</a>
    <header class="mast">
      <a class="brand" href="/"
        ><img src="/evidence-graph.png" width="34" height="34" alt="" />Ichnix</a
      >
      <nav aria-label="Primary">
        <a href="/docs">Docs</a><button id="leave" hidden>Disconnect</button>
      </nav>
    </header>
    <main class="workspace" id="review">
      <p class="micro" id="workspace-label">Investigation workspace</p>
      <h1>Review console</h1>
      <form id="connect" hidden>
        <label for="token">Operator access token</label>
        <div class="input-row">
          <input
            id="token"
            type="password"
            required
            autocomplete="off"
            spellcheck="false"
          /><button class="pill">Connect ↗</button>
        </div>
        <p class="hint">
          Use the access token configured by your workspace administrator.
        </p>
      </form>
      <details id="evaluation" hidden>
        <summary>Learning curve</summary>
        <div id="evaluation-result" aria-live="polite"></div>
      </details>
      <p id="status" role="status">Opening workspace…</p>
      <noscript>Enable JavaScript to open the review console.</noscript>
      <div id="desk" hidden>
        <aside>
          <div class="aside-title">
            <h2>Cases</h2>
            <button id="reload">Refresh</button>
          </div>
          <ul id="cases"></ul>
        </aside>
        <article
          id="detail"
          aria-label="Case details"
          aria-live="polite"
        ></article>
      </div>
    </main>
  </body>
</html>
